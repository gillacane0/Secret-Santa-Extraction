[project]
name = "secret-santa-extraction"
version = "0.1.0"
description = "Secret Santa draw with exclusions, history of past years and email notifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
